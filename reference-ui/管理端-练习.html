<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>练习管理</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #095fd5;
      --primary-light: #eaf3ff;
      --bg: #f5f7fa;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #7b8492;
      --line: #e7ebf0;
      --head: #f4f6f9;
      --danger: #ff4d4f;
      --success: #52c41a;
      --shadow: 0 2px 10px rgba(15, 23, 42, .06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 1180px;
      color: var(--text);
      background: var(--bg);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 14px;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* 最左侧图标栏 */
    .rail {
      width: 46px;
      flex: 0 0 46px;
      background: #fff;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 10px;
    }

    .rail-logo,
    .rail-item {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .rail-logo {
      margin-bottom: 15px;
      background: linear-gradient(145deg, #2389ff, #155cff);
      box-shadow: 0 4px 10px rgba(22, 119, 255, .22);
    }

    .logo-wave {
      width: 19px;
      height: 19px;
      border: 2px solid #fff;
      border-radius: 50%;
      position: relative;
    }

    .logo-wave::before,
    .logo-wave::after {
      content: "";
      position: absolute;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    .logo-wave::before {
      inset: 3px;
    }

    .logo-wave::after {
      inset: 7px;
    }

    .rail-label {
      color: #a5adb8;
      font-size: 10px;
      margin-bottom: 8px;
    }

    .rail-item {
      margin-bottom: 7px;
      color: #98a1ad;
      background: #f7f8fa;
    }

    .rail-item.active {
      color: #fff;
      background: var(--primary);
    }

    .rail-setting {
      margin-top: auto;
      font-size: 18px;
      color: #343b45;
    }

    /* 左侧导航 */
    .sidebar {
      width: 152px;
      flex: 0 0 152px;
      background: #fff;
      border-right: 1px solid var(--line);
    }

    .brand {
      height: 43px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
      font-weight: 700;
    }

    .brand-icon {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 18%, #fff 20% 24%, transparent 26% 42%, #fff 44% 48%, transparent 50%),
        linear-gradient(145deg, #2f91ff, #135cff);
    }

    .menu {
      padding: 12px 10px;
    }

    .menu-row,
    .sub-row {
      height: 36px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border-radius: 4px;
      color: #374151;
    }

    .menu-row {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .menu-row .arrow {
      margin-left: auto;
      color: #9aa3af;
    }

    .sub-row {
      padding-left: 26px;
      color: #4b5563;
      margin: 2px 0;
    }

    .sub-row.active {
      color: var(--primary);
      background: var(--primary-light);
      border-right: 3px solid var(--primary);
    }

    .main {
      flex: 1;
      min-width: 0;
    }

    .topbar {
      height: 43px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    .collapse {
      font-size: 17px;
      color: #4b5563;
      margin-right: 12px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a0a7b1;
      font-size: 13px;
    }

    .breadcrumb strong {
      color: #374151;
      font-weight: 600;
    }

    .top-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .globe {
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #6b7280;
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #9ba3ad;
      color: #fff;
    }

    .user {
      line-height: 1.05;
      font-size: 11px;
      font-weight: 700;
    }

    .user small {
      display: block;
      margin-top: 3px;
      color: #a0a7b1;
      font-weight: 400;
    }

    .content {
      padding: 16px 15px 22px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid #edf0f4;
      border-radius: 5px;
      box-shadow: var(--shadow);
    }

    /* 搜索栏 */
    .filter-panel {
      min-height: 48px;
      padding: 10px 14px;
      display: block;
      margin-bottom: 9px;
    }

    .form-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .form-item label {
      color: #4b5563;
      white-space: nowrap;
    }

    .control {
      height: 31px;
      width: 250px;
      border: 1px solid #d8dde6;
      border-radius: 3px;
      padding: 0 10px;
      color: #374151;
      outline: none;
      background: #fff;
    }

    .control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, .08);
    }

    select.control {
      width: 170px;
    }

    .filter-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .filter-title { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    .filter-search-row { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-top: 16px; }
    .filter-panel .category-secondary-tabs[hidden] { display: none !important; }

    .btn {
      height: 31px;
      padding: 0 14px;
      border-radius: 4px;
      border: 1px solid #d9dee7;
      background: #fff;
      color: #4b5563;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      color: #fff;
      border-color: var(--primary-hover);
      background: var(--primary-hover);
    }

    .btn-danger {
      color: var(--danger);
      border-color: #ffccc7;
      background: #fff2f0;
    }

    .btn-danger:hover {
      color: #fff;
      background: var(--danger);
      border-color: var(--danger);
    }

    /* 表格 */
    .table-panel {
      padding: 10px 12px 13px;
    }

    .toolbar {
      height: 36px;
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }

    .toolbar-right {
      margin-left: auto;
      display: flex;
      gap: 7px;
    }

    .circle-btn {
      width: 29px;
      height: 29px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #fff;
      color: #8e98a5;
      display: grid;
      place-items: center;
    }

    .circle-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .table-wrap {
      border: 1px solid #edf0f4;
      overflow: hidden;
      min-height: 610px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      background: var(--head);
    }

    th,
    td {
      height: 42px;
      padding: 0 10px;
      border-right: 1px solid #edf0f4;
      border-bottom: 1px solid #edf0f4;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      height: 36px;
      color: #374151;
      font-weight: 700;
    }

    td {
      color: #4b5563;
    }

    th:last-child,
    td:last-child {
      border-right: none;
    }

    tbody tr:hover {
      background: #f8fbff;
    }

    .col-check { width: 44px; }
    .col-name { width: 345px; }
    .col-category { width: 135px; }
    .col-version { width: 100px; }
    .col-time { width: 175px; }
    .col-action { width: 180px; }

    .name-cell {
      text-align: left;
    }

    .name-main {
      color: #263445;
      font-weight: 700;
      line-height: 1.25;
    }

    .name-file {
      color: #9aa3af;
      font-size: 12px;
      margin-top: 3px;
    }

    .category-tag {
      display: inline-flex;
      min-width: 52px;
      height: 23px;
      padding: 0 9px;
      border-radius: 12px;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .category-operation {
      color: #d46b08;
      background: #fff7e6;
    }

    .category-tech {
      color: #1677ff;
      background: #e6f4ff;
    }

    .category-product {
      color: #389e0d;
      background: #f6ffed;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 13px;
    }

    .link-btn {
      padding: 0;
      border: none;
      background: transparent;
      color: var(--primary);
    }

    .link-btn.delete {
      color: var(--danger);
    }

    .empty-row {
      padding: 55px 0;
      color: #9ca3af;
      text-align: center;
    }

    .pagination {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      font-size: 12px;
      color: #6b7280;
    }

    .page-size {
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fff;
      color: #4b5563;
    }

    .page-btn {
      min-width: 28px;
      height: 28px;
      border-radius: 3px;
      border: 1px solid var(--line);
      background: #fff;
      color: #4b5563;
    }

    .page-btn.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    /* 弹窗 */
    .mask {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 74px;
      background: rgba(0, 0, 0, .45);
    }

    .mask.show {
      display: flex;
    }

    .modal {
      width: min(1230px, calc(100vw - 90px));
      max-height: calc(100vh - 90px);
      overflow: hidden;
      background: #fff;
      border-radius: 5px;
      box-shadow: 0 20px 55px rgba(15, 23, 42, .22);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      min-height: 52px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
      font-weight: 700;
    }

    .modal-close {
      margin-left: auto;
      border: none;
      background: transparent;
      color: #98a1ad;
      font-size: 23px;
    }

    .modal-body {
      overflow: auto;
      padding: 17px 24px 16px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 24px;
    }

    .modal-field {
      display: grid;
      grid-template-columns: 88px 1fr;
      align-items: center;
      gap: 9px;
    }

    .modal-field.full {
      grid-column: 1 / -1;
    }

    .modal-field label {
      text-align: right;
      color: #4b5563;
      white-space: nowrap;
    }

    .required::before {
      content: "*";
      color: var(--danger);
      margin-right: 3px;
    }

    .modal-control {
      width: 100%;
      height: 34px;
      border: 1px solid #d8dde6;
      border-radius: 4px;
      padding: 0 10px;
      outline: none;
      color: #374151;
      background: #fff;
    }

    .modal-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, .08);
    }

    .modal-control:disabled {
      color: #6b7280;
      background: #f5f7fa;
      cursor: not-allowed;
    }

    textarea.modal-control {
      min-height: 82px;
      padding: 9px 10px;
      resize: vertical;
    }

    .upload-label {
      align-self: start;
      padding-top: 9px;
    }

    .upload-area {
      min-height: 118px;
      border: 1px dashed #ccd4df;
      border-radius: 5px;
      background: #fbfcfe;
      color: #7b8492;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      transition: .2s;
    }

    .upload-area:hover,
    .upload-area.drag {
      color: var(--primary);
      border-color: var(--primary);
      background: #f5f9ff;
    }

    .upload-icon {
      color: var(--primary);
      font-size: 27px;
      margin-bottom: 7px;
    }

    .upload-tip {
      margin-top: 5px;
      font-size: 12px;
      color: #a0a7b1;
    }

    .file-selected {
      color: #374151;
      font-weight: 600;
    }

    .section-title {
      grid-column: 1 / -1;
      margin-top: 4px;
      padding: 10px 0 8px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      color: #374151;
    }

    /* 复核题目 */
    .question-box {
      grid-column: 1 / -1;
      border: 1px solid var(--line);
      border-radius: 5px;
      overflow: hidden;
    }

    .question-toolbar {
      min-height: 45px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
    }

    .question-toolbar strong {
      color: #374151;
    }

    .question-toolbar .btn {
      margin-left: auto;
    }

    .question-list {
      max-height: 255px;
      overflow: auto;
    }

    .question-item {
      display: grid;
      grid-template-columns: 48px 1fr 115px 72px;
      align-items: center;
      min-height: 47px;
      border-bottom: 1px solid var(--line);
    }

    .question-item:last-child {
      border-bottom: none;
    }

    .question-item > div {
      padding: 8px 10px;
    }

    .question-no,
    .question-type {
      text-align: center;
      color: #6b7280;
    }

    .question-text {
      white-space: normal;
      line-height: 1.5;
    }

    .question-actions {
      text-align: center;
    }

    .modal-footer {
      flex: 0 0 auto;
      width: 100%;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 13px 18px 17px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .modal-footer .btn {
      min-width: 68px;
    }

    .mode-hidden {
      display: none !important;
    }

    .auto-question-message {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 1px solid #d6e4ff;
      border-radius: 4px;
      color: #4b6b9a;
      background: #f5f9ff;
      font-size: 13px;
      line-height: 1.5;
    }

    .auto-question-icon {
      width: 19px;
      height: 19px;
      flex: 0 0 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #fff;
      background: #1677ff;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    /* 小题目弹窗 */
    .small-mask {
      z-index: 1100;
      padding-top: 150px;
    }

    .small-modal {
      width: 610px;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 20px 55px rgba(15, 23, 42, .25);
    }

    .small-body {
      padding: 18px 22px;
    }

    .small-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .small-row label {
      text-align: right;
    }

    .toast {
      position: fixed;
      z-index: 3000;
      left: 50%;
      top: 66px;
      transform: translateX(-50%) translateY(-10px);
      padding: 10px 17px;
      border-radius: 5px;
      background: rgba(31, 41, 55, .94);
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .sidebar { width: 160px; flex: 0 0 160px; }
    .brand { height: 52px; padding: 0 16px; font-size: 17px; }
    .rail-item { text-decoration: none; }
    .rail-label { text-decoration: none; }
    .rail-label.active { color: var(--primary); font-weight: 700; }
    .admin-menu { padding: 12px 10px; }
    .admin-menu-item { height: 40px; padding: 0 12px; display: flex; align-items: center; border-radius: 6px; color: #485566; text-decoration: none; font-size: 14px; }
    .admin-menu-item + .admin-menu-item { margin-top: 4px; }
    .admin-menu-item.active { color: var(--primary); background: #e9f3ff; font-weight: 700; }
    .mode-rail { width: 62px; flex: 0 0 62px; display: flex; flex-direction: column; gap: 8px; padding: 16px 7px; background: #fff; border-right: 1px solid #e6ebf2; }
    .mode-rail-item { display: grid; justify-items: center; gap: 5px; padding: 8px 2px; border-radius: 9px; color: #6d7888; font-size: 10px; line-height: 1.2; text-decoration: none; }
    .mode-rail-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: #8d98a8; background: #f1f4f8; font-size: 15px; }
    .mode-rail-item.active { color: var(--primary); font-weight: 700; }
    .mode-rail-item.active .mode-rail-icon { color: #fff; background: var(--primary); }
    .brand { height: 52px; padding: 0 16px; gap: 9px; font-size: 17px; border-bottom: 1px solid #edf0f4; }
    .brand-logo { width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; background: radial-gradient(circle, transparent 18%, #fff 20% 24%, transparent 26% 42%, #fff 44% 48%, transparent 50%), linear-gradient(145deg, #2f91ff, #135cff); }
    .topbar { height: 52px; padding: 0 20px; background: #fff; border-bottom: 1px solid #edf0f4; }
    .breadcrumb { display: flex; align-items: center; gap: 9px; color: #667085; font-size: 13px; }
    .breadcrumb strong { color: #344054; }
    .content { padding: 18px 20px 30px; background: #f5f7fa; }
    .panel { border: 1px solid #edf0f4; border-radius: 6px; box-shadow: 0 2px 8px rgba(16,24,40,.04); }
    input, select, .control { height: 34px; border-radius: 4px; }
    .btn { min-height: 34px; border-radius: 4px; }
    th, td { height: 42px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="mode-rail" aria-label="端切换">
      <a class="mode-rail-item" href="./Web端-首页.html"><span class="mode-rail-icon">◉</span><span>用户端</span></a>
      <a class="mode-rail-item active" href="./管理端-资料.html"><span class="mode-rail-icon">◉</span><span>管理端</span></a>
    </aside>

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo"></span>
        <span>BLUEDOT</span>
      </div>

      <nav class="admin-menu">
        <a class="admin-menu-item" href="./管理端-资料.html">资料管理</a>
        <a class="admin-menu-item active" href="./管理端-练习.html">练习管理</a>
        <a class="admin-menu-item" href="./管理端-考试.html">考试管理</a>
        <a class="admin-menu-item" href="./管理端-题库.html">题库管理</a>
        <a class="admin-menu-item" href="./管理端-评价.html">评价管理</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="collapse">☷</div>
        <div class="breadcrumb">
          <strong>管理端</strong>
          <span>›</span>
          <span>练习管理</span>
        </div>

        <div class="top-right">
          <div class="globe">◎</div>
          <div class="avatar">●</div>
          <div class="user">
            user-001
            <small>普通用户</small>
          </div>
        </div>
      </header>

      <section class="content">
        <div class="panel filter-panel">
          <h2 class="filter-title">练习筛选</h2>
          <div id="practiceCategoryFilter"></div>
          <div class="filter-search-row"><div class="form-item">
            <label for="nameFilter">名称：</label>
            <input id="nameFilter" class="control" type="text" placeholder="请输入名称" />
          </div>

          <div class="filter-actions">
            <button class="btn btn-primary" id="searchBtn">⌕ 搜索</button>
            <button class="btn" id="resetBtn">♲ 重置</button>
          </div>
          </div>
        </div>

      exerciseSecondaryCategory.value = options.includes(selected) ? selected : "";
    }

      selectedMaterial = material;
      const category = material.primaryCategory || material.category || material.materialCategory || material.categoryName || "";

      exerciseCategory.value = category;
      renderSecondaryOptions(category, secondary);
      uploadType.value = String(material.fileType || material.type || material.extension || material.ext || "").toUpperCase();
      uploadText.textContent = `${material.name}${material.fileName ? ` · ${material.fileName}` : ""}（${uploadType.value || "--"} · ${category || "--"}${exerciseSecondaryCategory.value ? ` · ${exerciseSecondaryCategory.value}` : ""}）`;

      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

      if (category === "运营") return "category-operation";
      if (category === "技术") return "category-tech";
      return "category-product";
    }

    function renderTable(rows = visibleRecords) {
      visibleRecords = rows;
      if (!rows.length) {
        tableBody.innerHTML = '<tr><td colspan="7"><div class="empty-row">暂无符合条件的练习</div></td></tr>';
      } else {
        tableBody.innerHTML = rows.map(item => `
          <tr>
            <td>
              <input class="row-check" type="checkbox"
                data-id="${item.id}" ${selectedIds.has(item.id) ? "checked" : ""} />
            </td>
            <td class="name-cell">
              <div class="name-main" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
              <div class="name-file" title="${escapeHtml(item.fileName || "--")}">${escapeHtml(item.fileName || "--")}</div>
            </td>
            <td>
              <span class="category-tag ${categoryClass(item.primaryCategory || item.category)}">${escapeHtml(item.primaryCategory || item.category)}</span>${item.secondaryCategory || item.subCategory ? ` <span class="category-tag">${escapeHtml(item.secondaryCategory || item.subCategory)}</span>` : ""}
            </td>
            <td>${escapeHtml(item.version || "--")}</td>
            <td>${escapeHtml(item.createdAt)}</td>
            <td>${escapeHtml(item.updatedAt)}</td>
            <td>
              <div class="actions">
                <button class="link-btn" onclick="editRecord(${item.id})">✎ 编辑</button>
                <button class="link-btn delete" onclick="deleteRecord(${item.id})">♙ 删除</button>
              </div>
            </td>
          </tr>
        `).join("");
      }

      totalText.textContent = `共 ${rows.length} 条`;
      bindRowChecks();
      updateBatchState();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function bindRowChecks() {
      document.querySelectorAll(".row-check").forEach(box => {
        box.addEventListener("change", event => {
          const id = Number(event.target.dataset.id);
          if (event.target.checked) selectedIds.add(id);
          else selectedIds.delete(id);
          updateBatchState();
        });
      });
    }

    function updateBatchState() {
      const rowChecks = [...document.querySelectorAll(".row-check")];
      batchDeleteBtn.disabled = selectedIds.size === 0;
      checkAll.checked = rowChecks.length > 0 && rowChecks.every(box => box.checked);
      checkAll.indeterminate = rowChecks.some(box => box.checked) && !checkAll.checked;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1600);
    }

      uploadType.value = "";

      questionSectionTitle.classList.add("mode-hidden");
      questionBox.classList.add("mode-hidden");
      autoQuestionNotice.classList.remove("mode-hidden");

      exerciseModal.classList.add("show");
    }

      const item = records.find(row => row.id === id);
      if (!item) return;

      editingId = id;
      applyMaterial(getMaterials().find(material => material.id === item.selectedMaterialId) || { id: item.selectedMaterialId, name: item.name, fileName: item.fileName, type: item.type, category: item.category, primaryCategory: item.primaryCategory, secondaryCategory: item.secondaryCategory || item.subCategory });
      exerciseVersion.value = item.version || "v1";
      exerciseDesc.value = item.desc || "";
      currentQuestions = JSON.parse(JSON.stringify(item.questions || []));
      renderQuestions();

      document.getElementById("modalTitle").textContent = "编辑练习及题目";
      document.getElementById("saveBtn").textContent = "保存";

      questionSectionTitle.textContent = "题目管理";
      questionSectionTitle.classList.remove("mode-hidden");

    window.deleteRecord = function(id) {
      const item = records.find(row => row.id === id);

      records = records.filter(row => row.id !== id);
      selectedIds.delete(id);
      persistPractices();
      runSearch();
      showToast("删除成功");
    };

    function renderQuestions() {
      const keyword = document.getElementById("questionSearch")?.value.trim().toLowerCase() || "";
      const type = document.getElementById("questionTypeFilter")?.value || "";
      const shown = currentQuestions.map((q, index) => ({ q, index })).filter(({ q }) => (!keyword || q.text.toLowerCase().includes(keyword)) && (!type || q.type === type));
      document.getElementById("questionCount").textContent = `共 ${shown.length} 题`;
      if (!shown.length) {
        questionList.innerHTML = '<div class="empty-row" style="padding:30px 0;">暂无题目，请点击“新增题目”</div>';

      questionList.innerHTML = shown.map(({ q, index }) => `

          <div class="question-text">${escapeHtml(q.text)}</div>

        const matchName = !name || item.name.toLowerCase().includes(name);
        const material = getMaterials().find(row => String(row.id) === String(item.materialId ?? item.sourceMaterialId ?? item.selectedMaterialId));
        const matchCategory = practiceCategoryTabs.matches({ primary:item.primaryCategory ?? item.category ?? material?.primaryCategory ?? material?.category, secondary:item.secondaryCategory ?? item.subCategory ?? material?.secondaryCategory ?? material?.subCategory });
        return matchName && matchCategory;

      renderTable(result);

      const keyword = document.getElementById("materialSearch").value.trim().toLowerCase();
      const category = document.getElementById("materialCategory").value;
      const rows = getMaterials().filter(item => (!keyword || item.name.toLowerCase().includes(keyword)) && (!category || item.category === category));
      document.getElementById("materialList").innerHTML = rows.map(item => `<label class="question-item"><input type="radio" name="material" value="${item.id}" ${selectedMaterial?.id === item.id ? "checked" : ""}/><div class="question-text"><strong>${escapeHtml(item.name)}</strong><br><small>${escapeHtml(item.type || "--").toUpperCase()} · ${escapeHtml(item.category || "--")} · ${escapeHtml(item.time || "--")}</small></div></label>`).join("") || '<div class="empty-row">暂无可选择的资料</div>';
      document.getElementById("materialConfirm").disabled = !selectedMaterial;
    }
    document.getElementById("uploadArea").addEventListener("click", () => { selectedMaterial = null; renderMaterials(); materialModal.classList.add("show"); });
    ["materialSearch", "materialCategory"].forEach(id => document.getElementById(id).addEventListener("input", renderMaterials));
    document.getElementById("materialList").addEventListener("change", event => { selectedMaterial = getMaterials().find(item => item.id === Number(event.target.value)) || null; renderMaterials(); });
    document.getElementById("materialConfirm").addEventListener("click", () => { if (!selectedMaterial) return; applyMaterial(selectedMaterial); materialModal.classList.remove("show"); });
    exerciseCategory.addEventListener("change", () => renderSecondaryOptions(exerciseCategory.value));
    ["materialClose", "materialCancel"].forEach(id => document.getElementById(id).addEventListener("click", () => materialModal.classList.remove("show")));

    document.getElementById("saveBtn").addEventListener("click", () => {
      const category = exerciseCategory.value;
      const secondaryCategory = exerciseSecondaryCategory.value;
      const version = exerciseVersion.value.trim() || "v1";
      const desc = exerciseDesc.value.trim();
      if (!selectedMaterial) {
        showToast("请选择资料管理中的资料");
        return;
      }

      if (!category) {
        showToast("请选择所属类别");
        exerciseCategory.focus();
        return;
      }

      if (!secondaryCategory) {
        showToast("请选择细分方向");
        exerciseSecondaryCategory.focus();
        return;
      }

      if (!uploadType.value) {
        showToast("未识别到有效的上传类型");
        return;
      }

      const timestamp = nowText();

      if (editingId) {
        const index = records.findIndex(row => row.id === editingId);
        if (index !== -1) {
          records[index] = {
            ...records[index],
            name: selectedMaterial.name,
            category,
            primaryCategory: category,
            secondaryCategory,
            type: uploadType.value,
            selectedMaterialId: selectedMaterial.id,
            fileName: selectedMaterial.fileName || selectedMaterial.name,
            version,
            desc,
            updatedAt: timestamp,
            questions: JSON.parse(JSON.stringify(currentQuestions))
          };
        }
        showToast("保存成功");
      } else {
        records.unshift({
          id: Date.now(),
          name: selectedMaterial.name,
          category,
          primaryCategory: category,
          secondaryCategory,
          type: uploadType.value,
          selectedMaterialId: selectedMaterial.id,
          fileName: selectedMaterial.fileName || selectedMaterial.name,
          version,
          desc,
          createdAt: timestamp,
          updatedAt: timestamp,
          questions: generateMockQuestions(selectedMaterial.name, category)
        });
        showToast("生成成功");
      }

      persistPractices();
      closeExerciseModal();
      runSearch();
    });

    document.getElementById("addQuestionBtn").addEventListener("click", () => openQuestionModal());
    ["questionSearch", "questionTypeFilter"].forEach(id => document.getElementById(id).addEventListener("input", renderQuestions));

    document.getElementById("questionClose").addEventListener("click", closeQuestionModal);
    document.getElementById("questionCancel").addEventListener("click", closeQuestionModal);

    questionModal.addEventListener("click", event => {
      if (event.target === questionModal) closeQuestionModal();
    });

    document.getElementById("questionSave").addEventListener("click", () => {
      const type = document.getElementById("questionType").value;
      const text = document.getElementById("questionText").value.trim();
      const answer = document.getElementById("questionAnswer").value.trim();

      if (!text) {
        showToast("请输入题目内容");
        return;
      }

      const question = { type, text, answer };
      if (editingQuestionIndex === null) {
        currentQuestions.push(question);
      } else {
        currentQuestions[editingQuestionIndex] = question;
      }

      renderQuestions();
      closeQuestionModal();
    });

    document.getElementById("searchBtn").addEventListener("click", runSearch);

    document.getElementById("resetBtn").addEventListener("click", () => {
      document.getElementById("nameFilter").value = "";
      practiceCategoryTabs.reset();
      selectedIds.clear();
      renderTable(records);
    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
      runSearch();
      showToast("已刷新");
    });

    checkAll.addEventListener("change", event => {
      document.querySelectorAll(".row-check").forEach(box => {
        box.checked = event.target.checked;
        const id = Number(box.dataset.id);
        if (event.target.checked) selectedIds.add(id);
        else selectedIds.delete(id);
      });
      updateBatchState();
    });

    batchDeleteBtn.addEventListener("click", () => {
      if (!selectedIds.size) return;
      if (!confirm(`确定删除选中的 ${selectedIds.size} 条练习吗？`)) return;

      records = records.filter(item => !selectedIds.has(item.id));
      selectedIds.clear();
      persistPractices();
      runSearch();
      showToast("批量删除成功");
    });

    const practiceCategoryTabs = BluedotCategoryFilter.mount(document.getElementById("practiceCategoryFilter"), runSearch);
    persistPractices();
    renderTable(records);
  </script>
</body>
</html>
